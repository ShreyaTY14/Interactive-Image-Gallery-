<!DOCTYPE html> <html> 
  <head> <title>Wildlife Sanctuaries Image Gallery</title> <style> body{   margin:0;   font-family:Arial,sans-serif;   background:#CFA16E;  /* Light brown background */   color:#fff;   text-align:center;   min-height:100vh;   display:flex;   flex-direction:column; }  header{   background:#A0522D;   color:#fff;   padding:20px;   font-size:24px; }  .gallery{   display:grid;   grid-template-columns:repeat(3, 1fr); /* 3 images per row */   gap:15px;   max-width:960px;   margin:30px auto; }  .gallery a{   position:relative;   display:block; }  .gallery img{   width:100%;   height:200px;   object-fit:cover;   border-radius:10px;   transition:.3s; }  .gallery img:hover{   transform:scale(1.05);   box-shadow:0 0 10px #fff; }  .lightbox{   position:fixed;   top:0;   left:0;   width:100%;   height:100%;   background:rgba(0,0,0,.85);   display:none;   justify-content:center;   align-items:center;   backdrop-filter:blur(5px); }  .lightbox img{   width:60%;   border:4px solid #fff;   border-radius:10px; }  .close{   position:absolute;   top:20px;   right:30px;   color:#fff;   font-size:30px;   text-decoration:none; }  footer{   margin-top:auto;   background:#A0522D;   color:#fff;   padding:15px; } </style> </head>

<script>
const galleryLinks = document.querySelectorAll(".gallery a");
const lightboxes = document.querySelectorAll(".lightbox");
const closeBtns = document.querySelectorAll(".close");

galleryLinks.forEach(link => {
  link.addEventListener("click", function(e){
    e.preventDefault();
    const id = this.getAttribute("href");
    document.querySelector(id).style.display = "flex";
  });
});

closeBtns.forEach(btn => {
  btn.addEventListener("click", function(e){
    e.preventDefault();
    this.parentElement.style.display = "none";
  });
});
</script>
